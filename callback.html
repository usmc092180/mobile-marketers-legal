<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diabolical Bastards Analytics | Mobile Marketers</title><style>body{font-family:system-ui,sans-serif;max-width:860px;margin:40px auto;padding:0 16px;line-height:1.5;color:#222}h1{font-size:1.6rem;margin-bottom:.2rem}.sub{color:#666;margin-top:0}button,.btn{background:#fe2c55;color:#fff;border:0;border-radius:6px;padding:12px 22px;font-size:1rem;cursor:pointer;text-decoration:none;display:inline-block}code{background:#f3f3f3;padding:1px 5px;border-radius:4px}.card{border:1px solid #ddd;border-radius:10px;padding:16px;margin:16px 0}.row{display:flex;gap:16px;align-items:center}.row img{width:72px;height:72px;border-radius:50%}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:120px;background:#f7f7f7;border-radius:8px;padding:10px;text-align:center}.stat b{display:block;font-size:1.3rem}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:6px;border-bottom:1px solid #eee}td img{width:48px;height:64px;object-fit:cover;border-radius:4px}.err{color:#b00020}footer{margin-top:40px;font-size:.85rem;color:#666}</style></head><body>
<h1>Diabolical Bastards Analytics</h1>
<p class="sub">Operated by Mobile Marketers on behalf of Diabolical Bastards.</p>
<p id="status">Completing login with TikTok...</p>
<div id="out" hidden>
  <div class="card row"><img id="avatar" alt=""><div><h2 id="name" style="margin:0"></h2><div id="bio"></div><a id="profile" target="_blank" rel="noopener"></a></div></div>
  <div class="card"><h3 style="margin-top:0">Account statistics</h3><div class="stats" id="stats"></div></div>
  <div class="card"><h3 style="margin-top:0">Published videos</h3><table><thead><tr><th></th><th>Title</th><th>Views</th><th>Likes</th><th>Comments</th><th>Shares</th></tr></thead><tbody id="videos"></tbody></table></div>
  <p>Granted scopes: <code id="scope"></code></p>
  <a class="btn" href="demo.html">Back</a>
</div>
<footer><a href="terms.html">Terms of Service</a> | <a href="privacy.html">Privacy Policy</a></footer>
<script>
const HELPER = "http://localhost:8765";
const params = new URLSearchParams(location.search);
const status = document.getElementById("status");
const fmt = n => (n ?? 0).toLocaleString();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async () => {
  if (params.get("error")) { status.className = "err"; status.textContent = "Login was cancelled or denied: " + (params.get("error_description") || params.get("error")); return; }
  const code = params.get("code"), state = params.get("state");
  if (!code || !state) { status.className = "err"; status.textContent = "No login code found. Start again from the demo page."; return; }
  try {
    const r = await fetch(HELPER + "/exchange", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({code, state}) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Request failed");
    const u = j.user;
    document.getElementById("avatar").src = u.avatar_url || "";
    document.getElementById("name").textContent = u.display_name + (u.is_verified ? " (verified)" : "");
    document.getElementById("bio").textContent = u.bio_description || "";
    const p = document.getElementById("profile"); p.href = u.profile_deep_link || "#"; p.textContent = u.profile_deep_link || "";
    document.getElementById("stats").innerHTML = [["Followers", u.follower_count], ["Following", u.following_count], ["Likes", u.likes_count], ["Videos", u.video_count]]
      .map(([k, v]) => '<div class="stat"><b>' + fmt(v) + '</b>' + k + '</div>').join("");
    document.getElementById("videos").innerHTML = j.videos.map(v =>
      '<tr><td><img src="' + esc(v.cover_image_url) + '" alt=""></td><td>' + esc(v.title || "(untitled)") + '</td><td>' + fmt(v.view_count) + '</td><td>' + fmt(v.like_count) + '</td><td>' + fmt(v.comment_count) + '</td><td>' + fmt(v.share_count) + '</td></tr>').join("") || '<tr><td colspan="6">No videos returned.</td></tr>';
    document.getElementById("scope").textContent = j.scope;
    status.hidden = true; document.getElementById("out").hidden = false;
    history.replaceState(null, "", location.pathname);
  } catch (e) { status.className = "err"; status.textContent = "Login failed: " + e.message; }
})();
</script>
</body></html>
